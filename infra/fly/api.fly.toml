# ── Fly.io — API Gateway ─────────────────────────────────────────────────────
# FastAPI app — always-on, auto-scaled.
# See cloud.md for architecture.

app = "cave-api"
primary_region = "iad"

[env]
  ENVIRONMENT = "production"
  DEBUG = "false"
  RATE_LIMIT_ENABLED = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 2

[deploy]
  strategy = "rolling"

[[metrics]]
  port = 8000
  path = "/metrics"
