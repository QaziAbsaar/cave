[project]
name = "cave-saas"
version = "0.1.0"
description = "Multi-tenant SaaS platform that autonomously builds full-stack apps from a plain-language brief"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "mcp>=1.0.0",
    "litellm>=1.40.0",
    "langfuse>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "PLC", "PLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require Postgres, Redis, and a Celery worker",
]
